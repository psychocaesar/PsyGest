name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # le motif entre guillemets de `node --test` exige Node 21+
      # Les tests n'utilisent que Node (aucune dépendance npm) : pas d'installation.
      - run: npm test
